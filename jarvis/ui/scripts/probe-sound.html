<!doctype html><html><body><script type="module">
import { renderCue, cueDuration, SoundKit } from "/src/lib/sound.ts";

const CUES = ["tap", "wake", "listen", "send", "reply", "alert", "error"];

// --- 1. Mesure du signal reellement produit -------------------------------
const measured = [];
for (const cue of CUES) {
  const seconds = cueDuration(cue) + 0.3;
  const ctx = new OfflineAudioContext(1, Math.ceil(44100 * seconds), 44100);
  renderCue(ctx, ctx.destination, cue, 0);
  const buf = await ctx.startRendering();
  const d = buf.getChannelData(0);
  let peak = 0, last = 0, crossings = 0;
  for (let i = 0; i < d.length; i++) {
    const a = Math.abs(d[i]);
    if (a > peak) peak = a;
    if (a > 0.0005) last = i;
  }
  for (let i = 1; i < last; i++) if ((d[i - 1] < 0) !== (d[i] < 0)) crossings++;
  measured.push({
    cue, peak: +peak.toFixed(4), ms: Math.round(last / 44.1),
    hz: last ? Math.round((crossings / 2) / (last / 44100)) : 0,
  });
}

// --- 2. Les regles du kit --------------------------------------------------
// On compte les oscillateurs crees: c'est la preuve qu'un son est parti.
let created = 0;
const origin = AudioContext.prototype.createOscillator;
AudioContext.prototype.createOscillator = function () {
  created++;
  return origin.call(this);
};
const count = async (kit, action) => {
  created = 0;
  action();
  await new Promise((r) => setTimeout(r, 120));
  return created;
};

const kit = new SoundKit();
await kit.resume();
const rules = {};
rules.joue_quand_actif = (await count(kit, () => kit.play("tap"))) > 0;

kit.setMuted(true);
rules.muet_pendant_qu_il_parle = (await count(kit, () => kit.play("tap"))) === 0;
kit.setMuted(false);

kit.setEnabled(false);
rules.silencieux_si_desactive = (await count(kit, () => kit.play("tap"))) === 0;
kit.setEnabled(true);
await kit.resume();
rules.reprend_apres_reactivation = (await count(kit, () => kit.play("tap"))) > 0;

AudioContext.prototype.createOscillator = origin;

window.__RESULT__ = { measured, rules };
</script></body></html>
