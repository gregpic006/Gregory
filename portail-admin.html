<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1F2421; --paper:#F5F1E8; --paper-2:#EDE7D8;
    --brass:#B08D57; --brass-dark:#8A6B3E; --sage:#5F7355;
    --rust:#A63D40; --line:#C9C2AE; --muted:#8C8A7E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .login-box{width:100%;max-width:340px;padding:36px;background:var(--paper-2);border:1px solid var(--line);}
  .login-box .brand{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:4px;}
  .login-box .sub{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:24px;}
  .login-box label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;}
  .login-box .f{margin-bottom:14px;}
  .login-box input{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;font-family:'Inter',sans-serif;}
  .login-box button{width:100%;background:var(--ink);color:var(--paper);border:none;padding:12px;font-size:13.5px;font-weight:500;cursor:pointer;margin-top:6px;}
  .login-box button:hover{background:var(--brass-dark);}
  .login-error{color:var(--rust);font-size:12.5px;margin-top:10px;display:none;}

  #app-shell{display:none;padding:32px 40px;max-width:1100px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;}
  .subtitle{color:var(--muted);font-size:13.5px;}
  button.signout{background:none;border:1px solid var(--ink);padding:8px 16px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}
  button.signout:hover{background:var(--ink);color:var(--paper);}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:32px;}
  .metric{background:var(--paper-2);border:1px solid var(--line);padding:16px;}
  .metric.flag{border-color:var(--rust);}
  .metric .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .metric .val{font-family:'Fraunces',serif;font-size:26px;font-weight:600;}
  .metric.flag .val{color:var(--rust);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--paper-2);border:1px solid var(--line);}
  th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);border-bottom:1px solid var(--ink);font-weight:500;}
  td{padding:11px 14px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .empty-row td{color:var(--muted);font-style:italic;}
  .num{font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="brand">Portail</div>
    <div class="sub">Admin</div>
    <div class="f"><label>Courriel</label><input type="email" id="login-email"></div>
    <div class="f"><label>Mot de passe</label><input type="password" id="login-password"></div>
    <button onclick="handleLogin()">Se connecter</button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<div id="app-shell">
  <div class="topbar">
    <div>
      <h1>Vue d'ensemble</h1>
      <p class="subtitle">Tous les clients, tous les immeubles</p>
    </div>
    <button class="signout" onclick="handleSignOut()">Se déconnecter</button>
  </div>

  <div class="metrics">
    <div class="metric"><div class="label">Clients actifs</div><div class="val" id="m-clients">—</div></div>
    <div class="metric"><div class="label">Immeubles gérés</div><div class="val" id="m-buildings">—</div></div>
    <div class="metric"><div class="label">Logements sous gestion</div><div class="val" id="m-units">—</div></div>
    <div class="metric"><div class="label">Revenu de gestion mensuel</div><div class="val" id="m-revenue">—</div></div>
    <div class="metric flag"><div class="label">Travaux en attente d'approbation</div><div class="val" id="m-approvals">—</div></div>
    <div class="metric flag"><div class="label">Nouvelles demandes</div><div class="val" id="m-inquiries">—</div></div>
  </div>

  <table><thead><tr><th>Client</th><th>Téléphone</th><th class="num">Immeubles</th><th class="num">Logements</th><th class="num">Occupés</th><th class="num">Revenu/mois</th></tr></thead>
    <tbody id="clients-body"><tr class="empty-row"><td colspan="6">Chargement...</td></tr></tbody>
  </table>
</div>

<script>
const SUPABASE_URL = 'https://kdmwfbcziokygfcmjxeq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XJTO7hD6WHG9uK7Sg7LNDg_MM46QALR';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session) await loadAdminDashboard();
}

async function handleLogin(){
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ showLoginError(error.message); return; }
  await loadAdminDashboard();
}

async function handleSignOut(){
  await supabaseClient.auth.signOut();
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showLoginError(msg){
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function loadAdminDashboard(){
  const { data, error } = await supabaseClient.functions.invoke('admin-api');
  if(error){
    showLoginError('Accès refusé — ce compte n\'est pas administrateur.');
    await supabaseClient.auth.signOut();
    return;
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';

  const { totals, clients } = data;
  document.getElementById('m-clients').textContent = totals.clients_count;
  document.getElementById('m-buildings').textContent = totals.buildings_count;
  document.getElementById('m-units').textContent = totals.units_count;
  document.getElementById('m-revenue').textContent = totals.monthly_revenue.toLocaleString('fr-CA') + ' $';
  document.getElementById('m-approvals').textContent = totals.pending_approvals;
  document.getElementById('m-inquiries').textContent = totals.new_inquiries;

  const body = document.getElementById('clients-body');
  body.innerHTML = clients.length ? clients.map(c => `
    <tr>
      <td>${c.full_name}</td>
      <td>${c.phone || '—'}</td>
      <td class="num">${c.buildings_count}</td>
      <td class="num">${c.units_count}</td>
      <td class="num">${c.occupied_count}</td>
      <td class="num">${c.monthly_revenue.toLocaleString('fr-CA')} $</td>
    </tr>`).join('') : '<tr class="empty-row"><td colspan="6">Aucun client.</td></tr>';
}

init();
</script>
</body>
</html>
