# Config Supabase CLI — utilisée uniquement par le pipeline de
# déploiement (.github/workflows/deploy.yml). Ne change pas la façon de
# travailler au quotidien : les fichiers source restent
# edge-function-<nom>.ts à la racine du repo, copiés dans
# supabase/functions/<nom>/index.ts par le workflow au moment du
# déploiement (voir ce fichier), jamais commités sous cette forme.
#
# verify_jwt = true  → Supabase rejette la requête AVANT même d'exécuter
#   la fonction si le token n'est pas un JWT Supabase valide. Réservé
#   aux fonctions où TOUT appel légitime vient d'un utilisateur connecté
#   (propriétaire/locataire/admin/travailleur/prospecteur).
# verify_jwt = false → la fonction gère elle-même l'authentification
#   (lien à token unique, secret partagé, appel système/cron, ou aucune
#   auth requise pour un formulaire public). Les 13 fonctions
#   "admin-authentifiées" vérifient de toute façon la signature JWT en
#   code (voir README, section Sécurité) — ce réglage plateforme est une
#   couche additionnelle, pas la seule.

project_id = "kdmwfbcziokygfcmjxeq"

[functions.admin-api]
verify_jwt = true
