# Config Supabase CLI — utilisée uniquement par le pipeline de
# déploiement (.github/workflows/deploy.yml). Ne change pas la façon de
# travailler au quotidien : les fichiers source restent
# edge-function-<nom>.ts à la racine du repo, copiés dans
# supabase/functions/<nom>/index.ts par le workflow au moment du
# déploiement (voir ce fichier), jamais commités sous cette forme.
#
# verify_jwt = true  → Supabase rejette la requête AVANT même d'exécuter
#   la fonction si le token n'est pas un JWT Supabase valide. RÉGLÉ À
#   FALSE PARTOUT actuellement — la passerelle Edge Functions a un bug
#   connu qui rejette à tort les JWT signés en ES256 (clés asymétriques,
#   le mode par défaut du projet) quand ce réglage est à true, voir
#   github.com/supabase/supabase/issues/42244. Contournement officiel
#   Supabase : verify_jwt=false + vérification manuelle dans le code.
# verify_jwt = false → la fonction gère elle-même l'authentification.
#   Les 14 fonctions "admin-authentifiées" vérifient le JWT en code en
#   appelant GET /auth/v1/user (voir README, section Sécurité) — c'est
#   la SEULE vérification pour ces fonctions tant que le bug Supabase
#   ci-dessus n'est pas corrigé côté plateforme. Repasser ces 14
#   fonctions à true seulement après confirmation que ce bug est réglé.

project_id = "kdmwfbcziokygfcmjxeq"

[functions.admin-api]
verify_jwt = false
